<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Café Chanchamayo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      var tema = localStorage.getItem('cafe_tema');
      var oscuro = tema === 'oscuro' || (tema == null && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
